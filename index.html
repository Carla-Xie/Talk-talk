    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function highlight(text, words) {
      var html = escapeHtml(text);
      if (!words || !words.length) return html;
      var sorted = words.slice().sort(function (a, b) { return b.length - a.length; });
      for (var i = 0; i < sorted.length; i++) {
        var w = escapeHtml(sorted[i]);
        if (!w) continue;
        var re = new RegExp(w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
        html = html.replace(re, '<span class="hl">$&</span>');
      }
      return html;
    }

    function loadLearned() {
      try { return JSON.parse(localStorage.getItem(LEARNED_KEY) || '[]'); }
      catch (e) { return []; }
    }

    function itemKey(si, ii) {
      return si + '-' + ii;
    }

    function markLearned(si, ii) {
      var list = loadLearned();
      var k = itemKey(si, ii);
      if (list.indexOf(k) === -1) {
        list.push(k);
        localStorage.setItem(LEARNED_KEY, JSON.stringify(list));
      }
    }

    function totalSentenceCount() {
      var n = 0;
      for (var s = 0; s < SCENES.length; s++) n += SCENES[s].items.length * 2;
      return n;
    }

    function masteredSentenceCount() {
      return loadLearned().length * 2;
    }

    function firstUnlearnedTitle() {
      var learned = loadLearned();
      for (var s = 0; s < SCENES.length; s++) {
        for (var i = 0; i < SCENES[s].items.length; i++) {
          if (learned.indexOf(itemKey(s, i)) === -1) return SCENES[s].items[i].title;
        }
      }
      return '已全部学完';
    }

    function pickHomeSentence() {
      var d = new Date();
      var i = (d.getFullYear() * 400 + d.getMonth() * 31 + d.getDate()) % HOME_BANK.length;
      return HOME_BANK[i];
    }

    function renderHome() {
      var total = totalSentenceCount();
      var got = Math.min(masteredSentenceCount(), total);
      var r = 40;
      var c = 2 * Math.PI * r;
      var off = c * (1 - (total ? got / total : 0));
      var quote = pickHomeSentence();
      var task = firstUnlearnedTitle();
      document.getElementById('page-home').innerHTML =
        '<h1 id="home-title">能开口就行</h1>' +
        '<p id="home-sub">Just Speak Aloud</p>' +
        '<div class="ring-wrap">' +
          '<svg viewBox="0 0 100 100" aria-hidden="true">' +
            '<circle cx="50" cy="50" r="' + r + '" fill="none" stroke="#ddd" stroke-width="8"></circle>' +
            '<circle cx="50" cy="50" r="' + r + '" fill="none" stroke="#111" stroke-width="8" ' +
              'stroke-linecap="round" stroke-dasharray="' + c.toFixed(2) + '" stroke-dashoffset="' + off.toFixed(2) + '"></circle>' +
          '</svg>' +
          '<div class="ring-label"><strong>' + got + ' / ' + total + '</strong><span>已掌握</span></div>' +
        '</div>' +
        '<div class="home-quote">' +
          '<p class="en-row"><span class="en">' + escapeHtml(quote.en) + '</span>' +
            '<button type="button" class="speak" aria-label="播放">' + PLAY_ICON + '</button></p>' +
          '<p class="zh">' + escapeHtml(quote.zh) + '</p>' +
        '</div>' +
        '<div class="home-bottom">' +
          '<div class="home-box"><p class="k">今日学习任务</p><p class="v">' + escapeHtml(task) + '</p></div>' +
          '<div class="home-box"><p class="k">连续学习</p><p class="v">' + STREAK_DAYS + ' 天</p></div>' +
        '</div>';
    }

    function loadFavs() {
      try { return JSON.parse(localStorage.getItem(FAV_KEY) || '[]'); }
      catch (e) { return []; }
    }

    function isFav(en, zh) {
      return loadFavs().some(function (x) { return x.en === en && x.zh === zh; });
    }

    function toggleFav(en, zh) {
      var list = loadFavs();
      var idx = -1;
      for (var i = 0; i < list.length; i++) {
        if (list[i].en === en && list[i].zh === zh) { idx = i; break; }
      }
      if (idx >= 0) {
        list.splice(idx, 1);
        localStorage.setItem(FAV_KEY, JSON.stringify(list));
        return false;
      }
      list.push({ en: en, zh: zh });
      localStorage.setItem(FAV_KEY, JSON.stringify(list));
      return true;
    }

    function showToast(anchor, text) {
      var wrap = anchor.closest('.fav-wrap') || anchor.parentNode;
      var old = wrap.querySelector('.toast');
      if (old) old.remove();
      var t = document.createElement('span');
      t.className = 'toast';
      t.textContent = text;
      wrap.appendChild(t);
      setTimeout(function () { if (t.parentNode) t.parentNode.removeChild(t); }, 1400);
    }

    function sentenceBtns(en, zh) {
      return '<button type="button" class="speak" aria-label="播放">' + PLAY_ICON + '</button>' +
        '<span class="fav-wrap"><button type="button" class="fav' + (isFav(en, zh) ? ' on' : '') +
          '" data-en="' + escapeHtml(en) + '" data-zh="' + escapeHtml(zh) + '" aria-label="收藏">' +
          STAR_ICON + '</button></span>';
    }

    function renderCards(list, kind) {
      cards.classList.toggle('col', kind === 'scene');
      var html = '';
      for (var i = 0; i < list.length; i++) {
        var label = kind === 'scene' ? ('场景' + CN_NUM[i] + '：' + list[i].title) : list[i].title;
        html += '<div class="card" data-kind="' + kind + '" data-i="' + i + '">' +
          escapeHtml(label) + '</div>';
      }
      cards.innerHTML = html;
      cards.hidden = false;
      dialog.hidden = true;
      backBtn.hidden = kind !== 'item';
      view = kind === 'scene' ? 'scenes' : 'subs';
    }

    function showScenes() {
      currentScene = null;
      renderCards(SCENES, 'scene');
    }

    function showSubs(si) {
      currentScene = si;
      renderCards(SCENES[si].items, 'item');
    }

    function openItem(si, ii) {
      currentScene = si;
      currentItem = ii;
      var item = SCENES[si].items[ii];
      view = 'dialog';
      dialogBody.innerHTML =

        '<p class="en-row">英文句子：<span class="en">' + highlight(item.visitorEn, item.visitorHl) + '</span> ' +
          sentenceBtns(item.visitorEn, item.visitorZh) + '</p>' +
        '<p>中文翻译：' + highlight(item.visitorZh, item.visitorHl) + '</p>' +
        '<p>商家回答：</p>' +
        '<p class="en-row">英文句子：<span class="en merchant-en">' + highlight(item.merchantEn, item.merchantHl) + '</span> ' +
          sentenceBtns(item.merchantEn, item.merchantZh) + '</p>' +
        '<p>对应中文：' + highlight(item.merchantZh, item.merchantHl) + '</p>';
      mountPracticePanel();
      cards.hidden = true;
      dialog.hidden = false;
      backBtn.hidden = false;
    }

    cards.onclick = function (e) {
      var card = e.target.closest('.card');
      if (!card) return;
      var i = Number(card.getAttribute('data-i'));
      if (card.getAttribute('data-kind') === 'scene') showSubs(i);
      else openItem(currentScene, i);
    };

    function speak(text, btn) {
      speechSynthesis.cancel();
      var playing = document.querySelectorAll('.speak.playing');
      for (var p = 0; p < playing.length; p++) playing[p].classList.remove('playing');
      var u = new SpeechSynthesisUtterance(text);
      u.lang = 'en-US';
      var voices = speechSynthesis.getVoices();
      for (var i = 0; i < voices.length; i++) {
        if (voices[i].lang.indexOf('en') === 0) {
          u.voice = voices[i];
          break;
        }
      }
      if (btn) {
        btn.classList.add('playing');
        u.onend = function () { btn.classList.remove('playing'); };
        u.onerror = function () { btn.classList.remove('playing'); };
      }
      speechSynthesis.speak(u);
    }
    speechSynthesis.getVoices();

    dialogBody.onclick = function (e) {
      var speakBtn = e.target.closest('.speak');
      if (speakBtn) {
        var en = speakBtn.previousElementSibling;
        if (en && en.classList.contains('en')) speak(en.textContent, speakBtn);
        return;
      }
      var favBtn = e.target.closest('.fav');
      if (!favBtn) return;
      var enText = favBtn.getAttribute('data-en') || '';
      var zhText = favBtn.getAttribute('data-zh') || '';
      var on = toggleFav(enText, zhText);
      if (on) favBtn.classList.add('on');
      else favBtn.classList.remove('on');
      showToast(favBtn, on ? '已收藏句子' : '已取消收藏');
    };

    backBtn.onclick = function () {
      stopRecording(true);
      speechSynthesis.cancel();
      if (view === 'dialog') showSubs(currentScene);
      else showScenes();
    };

    function mountPracticePanel() {
      var targetEl = dialogBody.querySelector('.merchant-en') || dialogBody.querySelector('.en');
      var target = targetEl ? targetEl.textContent.trim() : '';

      var panel = document.createElement('div');
      panel.className = 'practice';
      panel.innerHTML =
        '<p class="practice-hint">按住下方按钮，朗读商家英文回答</p>' +
        '<p class="practice-target"></p>' +
        '<button type="button" class="record-btn" id="record-btn">按住<br>录音</button>' +
        '<p class="record-status" id="record-status">松开后自动评分</p>' +
        '<div class="score-panel" id="score-panel" hidden>' +
          '<p class="score-rating" id="score-rating"></p>' +
          '<div class="score-row"><span>发音准确度</span><strong id="score-pronunciation">-</strong></div>' +
          '<div class="score-row"><span>流利度</span><strong id="score-fluency">-</strong></div>' +
          '<div class="score-row"><span>完整度</span><strong id="score-completeness">-</strong></div>' +
          '<p class="score-transcript" id="score-transcript"></p>' +
          '<p class="score-comment" id="score-comment"></p>' +
        '</div>';

      panel.querySelector('.practice-target').textContent = target;
      dialogBody.appendChild(panel);

      var btn = panel.querySelector('#record-btn');
      btn.addEventListener('pointerdown', onRecordStart);
      btn.addEventListener('pointerup', onRecordEnd);
      btn.addEventListener('pointercancel', onRecordEnd);
      btn.addEventListener('pointerleave', function (ev) {
        if (recording) onRecordEnd(ev);
      });
      btn.addEventListener('contextmenu', function (ev) { ev.preventDefault(); });
    }

    function setStatus(text) {
      var el = document.getElementById('record-status');
      if (el) el.textContent = text;
    }

    function onRecordStart(e) {
      e.preventDefault();
      if (scoring) return;
      if (!SpeechRecognition) {
        setStatus('当前浏览器不支持语音识别，请用 Chrome / Edge');
        return;
      }

      var btn = document.getElementById('record-btn');
      if (btn.setPointerCapture) {
        try { btn.setPointerCapture(e.pointerId); } catch (err) {}
      }

      finalTranscript = '';
      recognition = new SpeechRecognition();
      recognition.lang = 'en-US';
      recognition.continuous = true;
      recognition.interimResults = true;

      recognition.onresult = function (event) {
        var interim = '';
        var finalText = '';
        for (var i = 0; i < event.results.length; i++) {
          var piece = event.results[i][0].transcript;
          if (event.results[i].isFinal) finalText += piece;
          else interim += piece;
        }
        if (finalText) finalTranscript = finalText.trim();
        setStatus('识别中：' + (finalTranscript || interim || '…'));
      };

      recognition.onerror = function (event) {
        var err = event.error || '';
        if (err === 'aborted' || err === 'no-speech') return;
        setStatus('识别出错：' + err);
      };

      try {
        recognition.start();
        recording = true;
        btn.classList.add('recording');
        btn.innerHTML = '录音中';
        setStatus('正在听，请朗读…');
      } catch (err) {
        setStatus('无法启动麦克风：' + err.message);
      }
    }

    function onRecordEnd(e) {
      if (e) e.preventDefault();
      if (!recording) return;
      stopRecording(false);
    }

    function stopRecording(skipScore) {
      recording = false;
      var btn = document.getElementById('record-btn');
      if (btn) {
        btn.classList.remove('recording');
        btn.innerHTML = '按住<br>录音';
      }

      if (recognition) {
        try { recognition.stop(); } catch (err) {}
        recognition = null;
      }

      if (skipScore) return;

      setTimeout(function () {
        submitScore(finalTranscript.trim());
      }, 350);
    }

    function submitScore(transcript) {
      var targetEl = dialogBody.querySelector('.practice-target');
      var target = targetEl ? targetEl.textContent.trim() : '';
      if (!target) {
        setStatus('未找到目标句子');
        return;
      }
      if (!transcript) {
        setStatus('没有识别到有效语音，请按住再说一次');
        return;
      }

      scoring = true;
      var btn = document.getElementById('record-btn');
      if (btn) btn.disabled = true;
      setStatus('正在评分…');

      fetch('/api/score', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ target: target, transcript: transcript })
      })
        .then(function (res) {
          return res.text().then(function (text) {
            var data;
            try {
              data = JSON.parse(text);
            } catch (e) {
              throw new Error('评分接口异常（HTTP ' + res.status + '）');
            }
            if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
            return data;
          });
        })
        .then(function (data) {
          if (currentScene != null && currentItem != null) markLearned(currentScene, currentItem);
          renderScore(data);
          setStatus('评分完成，可再次按住重试');
        })
        .catch(function (err) {
          setStatus('评分失败：' + err.message);
        })
        .finally(function () {
          scoring = false;
          if (btn) btn.disabled = false;
        });
    }

    function renderScore(data) {
      var panel = document.getElementById('score-panel');
      var ratingEl = document.getElementById('score-rating');
      panel.hidden = false;

      ratingEl.className = 'score-rating';
      if (data.rating === '优秀') ratingEl.classList.add('excellent');
      else if (data.rating === '不错') ratingEl.classList.add('good');
      else ratingEl.classList.add('retry');

      ratingEl.textContent = '综合评级：' + data.rating + '（' + data.overall + ' 分）';
      document.getElementById('score-pronunciation').textContent = data.pronunciation + ' / 100';
      document.getElementById('score-fluency').textContent = data.fluency + ' / 100';
      document.getElementById('score-completeness').textContent = data.completeness + ' / 100';
      document.getElementById('score-transcript').textContent = '识别结果：' + (data.transcript || '');
      var comment = data.comment ? ('点评：' + data.comment) : '';
      if (data.source === 'local_fallback') {
        comment = (comment ? comment + ' ' : '') + '（当前为本地兜底评分）';
      }
      document.getElementById('score-comment').textContent = comment;
      if (data.warning) {
        document.getElementById('score-comment').textContent =
          comment + (comment ? ' ' : '') + data.warning;
      }
    }

    function showTab(name) {
      var ids = { home: 'page-home', scenes: 'page-scenes', practice: 'page-practice', me: 'page-me' };
      for (var k in ids) {
        document.getElementById(ids[k]).classList.toggle('on', k === name);
      }
      var tabs = document.querySelectorAll('#tabbar button');
      for (var t = 0; t < tabs.length; t++) {
        tabs[t].classList.toggle('on', tabs[t].getAttribute('data-page') === name);
      }
      if (name === 'home') renderHome();
    }

    document.getElementById('tabbar').onclick = function (e) {
      var b = e.target.closest('button');
      if (b) showTab(b.getAttribute('data-page'));
    };

    document.getElementById('page-home').onclick = function (e) {
      var btn = e.target.closest('.speak');
      if (!btn) return;
      var en = btn.previousElementSibling;
      if (en && en.classList.contains('en')) speak(en.textContent, btn);
    };

    showScenes();
    showTab('home');
  </script>
</body>
</html>
