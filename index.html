    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function highlight(text, words) {
      var html = escapeHtml(text);
      if (!words || !words.length) return html;
      var sorted = words.slice().sort(function (a, b) { return b.length - a.length; });
      for (var i = 0; i < sorted.length; i++) {
        var w = escapeHtml(sorted[i]);
        if (!w) continue;
        var re = new RegExp(w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
        html = html.replace(re, '<span class="hl">$&</span>');
      }
      return html;
    }

    function loadJson(key, fallback) {
      try {
        var v = JSON.parse(localStorage.getItem(key) || 'null');
        return v == null ? fallback : v;
      } catch (e) { return fallback; }
    }

    function saveJson(key, val) {
      localStorage.setItem(key, JSON.stringify(val));
    }

    function loadMastered() {
      return loadJson(MASTERED_KEY, []);
    }

    function isSentenceMastered(en) {
      var t = (en || '').trim();
      return loadMastered().indexOf(t) !== -1;
    }

    function markSentenceMastered(en) {
      var t = (en || '').trim();
      if (!t) return;
      var list = loadMastered();
      if (list.indexOf(t) === -1) {
        list.push(t);
        saveJson(MASTERED_KEY, list);
      }
    }

      var map = loadWrong();

      var n = 0;

      for (var i = 0; i < all.length; i++) {
        if (isSentenceMastered(all[i])) n++;
      }
      return n;

    }

    function getStreakDays() {
      var s = loadJson(STREAK_KEY, { days: 0, last: '' });
      var today = todayStr();
      if (s.last === today) return s.days || 1;
      if (s.last === yesterdayStr()) s.days = (s.days || 0) + 1;
      else s.days = 1;
      s.last = today;
      saveJson(STREAK_KEY, s);
      return s.days;
    }

    function formatStudy(ms) {
      var m = Math.floor(ms / 60000);
      var h = Math.floor(m / 60);
      m = m % 60;
      if (h <= 0) return m + ' 分钟';
      return h + ' 小时 ' + m + ' 分钟';
    }

    function shuffleNoAdj(arr) {
      var pool = arr.slice();
      var out = [];
      while (pool.length) {
        var cands = [];
        for (var i = 0; i < pool.length; i++) {
          var same = out.length && pool[i].si === out[out.length - 1].si && pool[i].ii === out[out.length - 1].ii;
          if (!same) cands.push(i);
        }
        if (!cands.length) cands = [0];
        var pick = cands[Math.floor(Math.random() * cands.length)];
        out.push(pool[pick]);
        pool.splice(pick, 1);
      }
      return out;
    }

    function neededDailyTimes(si, ii) {
      var k = itemKey(si, ii);
      if (loadWrong()[k]) return 1;
      if (loadPassed().indexOf(k) !== -1) return 1;
      var it = SCENES[si] && SCENES[si].items[ii];
      if (!it) return 0;
      if (isSentenceMastered(it.visitorEn) || isSentenceMastered(it.merchantEn)) return 1;
      return 0;
    }

    function buildDailyQueue() {
      var units = [];
      for (var s = 0; s < SCENES.length; s++) {
        for (var i = 0; i < SCENES[s].items.length; i++) {
          if (neededDailyTimes(s, i)) units.push({ si: s, ii: i });
        }
      }
      return shuffleNoAdj(units);
    }

    function uniquifyDaily(data) {
      var seen = {};
      var out = [];
      var newIdx = 0;
      for (var i = 0; i < data.queue.length; i++) {
        var k = itemKey(data.queue[i].si, data.queue[i].ii);
        if (seen[k]) continue;
        seen[k] = true;
        if (i < data.idx) newIdx += 1;
        out.push(data.queue[i]);
      }
      data.queue = out;
      data.idx = Math.min(newIdx, out.length);
      return data;
    }

    function getDaily() {
      var data = loadJson(DAILY_KEY, null);
      var day = todayStr();
      if (!data || data.date !== day) {
        data = { date: day, queue: buildDailyQueue(), idx: 0 };
        saveJson(DAILY_KEY, data);
      } else {
        var before = data.queue.length + ':' + data.idx;
        uniquifyDaily(data);
        if (before !== data.queue.length + ':' + data.idx) saveDaily(data);
      }
      return data;
    }

    function saveDaily(data) {
      saveJson(DAILY_KEY, data);
    }

    function injectDaily(si, ii) {
      if (!neededDailyTimes(si, ii)) return;
      var data = getDaily();
      for (var i = 0; i < data.queue.length; i++) {
        if (data.queue[i].si === si && data.queue[i].ii === ii) return;
      }
      data.queue.push({ si: si, ii: ii });
      var done = data.queue.slice(0, data.idx);
      var rest = data.queue.slice(data.idx);
      data.queue = done.concat(shuffleNoAdj(rest));
      saveDaily(data);
    }

    function toggleFav(en, zh) {
      var list = loadFavs();
      var idx = -1;
      for (var i = 0; i < list.length; i++) {
        if (list[i].en === en && list[i].zh === zh) { idx = i; break; }
      }
      if (idx >= 0) {
        list.splice(idx, 1);
        localStorage.setItem(FAV_KEY, JSON.stringify(list));
        return false;

      list.push({ en: en, zh: zh });
      localStorage.setItem(FAV_KEY, JSON.stringify(list));

    function speak(text, btn) {
      speechSynthesis.cancel();
      var playing = document.querySelectorAll('.speak.playing');
      for (var p = 0; p < playing.length; p++) playing[p].classList.remove('playing');
      var u = new SpeechSynthesisUtterance(text);
      u.lang = 'en-US';
      var voices = speechSynthesis.getVoices();
      for (var i = 0; i < voices.length; i++) {
        if (voices[i].lang.indexOf('en') === 0) {
          u.voice = voices[i];
          break;
        }
      }
      if (btn) {
        btn.classList.add('playing');
        u.onend = function () { btn.classList.remove('playing'); };
        u.onerror = function () { btn.classList.remove('playing'); };
      }
      speechSynthesis.speak(u);
    }

    function mountPracticePanel() {
      var targetEl = dialogBody.querySelector('.merchant-en') || dialogBody.querySelector('.en');
      var target = targetEl ? targetEl.textContent.trim() : '';

      var panel = document.createElement('div');
      panel.className = 'practice';
      panel.innerHTML =
        '<p class="practice-hint">按住下方按钮，朗读商家英文回答</p>' +
        '<p class="practice-target"></p>' +
        '<button type="button" class="record-btn" id="record-btn">按住<br>录音</button>' +
        '<p class="record-status" id="record-status">松开后自动评分</p>' +
        '<div class="score-panel" id="score-panel" hidden>' +
          '<p class="score-rating" id="score-rating"></p>' +
          '<div class="score-row"><span>发音准确度</span><strong id="score-pronunciation">-</strong></div>' +
          '<div class="score-row"><span>流利度</span><strong id="score-fluency">-</strong></div>' +
          '<div class="score-row"><span>完整度</span><strong id="score-completeness">-</strong></div>' +
          '<p class="score-transcript" id="score-transcript"></p>' +
          '<p class="score-comment" id="score-comment"></p>' +
        '</div>';

      panel.querySelector('.practice-target').textContent = target;
      dialogBody.appendChild(panel);

      var btn = panel.querySelector('#record-btn');
      btn.addEventListener('pointerdown', onRecordStart);
      btn.addEventListener('pointerup', onRecordEnd);
      btn.addEventListener('pointercancel', onRecordEnd);
      btn.addEventListener('pointerleave', function (ev) {
        if (recording) onRecordEnd(ev);
      });
      btn.addEventListener('contextmenu', function (ev) { ev.preventDefault(); });
    }

    function setStatus(text) {
      var el = document.getElementById('record-status');
      if (el) el.textContent = text;
    }

    function onRecordStart(e) {
      e.preventDefault();
      if (scoring) return;
      if (!SpeechRecognition) {
        setStatus('当前浏览器不支持语音识别，请用 Chrome / Edge');
        return;
      }

      var btn = document.getElementById('record-btn');
      if (btn.setPointerCapture) {
        try { btn.setPointerCapture(e.pointerId); } catch (err) {}
      }

      finalTranscript = '';
      recognition = new SpeechRecognition();
      recognition.lang = 'en-US';
      recognition.continuous = true;
      recognition.interimResults = true;

      recognition.onresult = function (event) {
        var interim = '';
        var finalText = '';
        for (var i = 0; i < event.results.length; i++) {
          var piece = event.results[i][0].transcript;
          if (event.results[i].isFinal) finalText += piece;
          else interim += piece;
        }
        if (finalText) finalTranscript = finalText.trim();
        setStatus('识别中：' + (finalTranscript || interim || '…'));
      };

      recognition.onerror = function (event) {
        var err = event.error || '';
        if (err === 'aborted' || err === 'no-speech') return;
        setStatus('识别出错：' + err);
      };

      try {
        recognition.start();
        recording = true;
        btn.classList.add('recording');
        btn.innerHTML = '录音中';
        setStatus('正在听，请朗读…');
      } catch (err) {
        setStatus('无法启动麦克风：' + err.message);
      }
    }

    function onRecordEnd(e) {
      if (e) e.preventDefault();
      if (!recording) return;
      stopRecording(false);
    }

    function stopRecording(skipScore) {
      recording = false;
      var btn = document.getElementById('record-btn');
      if (btn) {
        btn.classList.remove('recording');
        btn.innerHTML = '按住<br>录音';
      }

      if (recognition) {
        try { recognition.stop(); } catch (err) {}
        recognition = null;
      }

      if (skipScore) return;

      setTimeout(function () {
        submitScore(finalTranscript.trim());
      }, 350);
    }

    function submitScore(transcript) {
      var targetEl = dialogBody.querySelector('.practice-target');
      var target = targetEl ? targetEl.textContent.trim() : '';
      if (!target) {
        setStatus('未找到目标句子');
        return;
      }
      if (!transcript) {
        setStatus('没有识别到有效语音，请按住再说一次');
        return;
      }

      scoring = true;
      var btn = document.getElementById('record-btn');
      if (btn) btn.disabled = true;
      setStatus('正在评分…');

      fetch('/api/score', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ target: target, transcript: transcript })
      })
        .then(function (res) {
          return res.text().then(function (text) {
            var data;
            try {
              data = JSON.parse(text);
            } catch (e) {
              throw new Error('评分接口异常（HTTP ' + res.status + '）');
            }
            if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
            return data;
          });
        })
        .then(function (data) {
          if (currentScene != null && currentItem != null) {
            var item = SCENES[currentScene].items[currentItem];
            var good = data.rating === '优秀' || data.rating === '不错';
            if (good) {
              markSentenceMastered(item.merchantEn);
              markPassed(currentScene, currentItem);
              bumpWrongGoods(currentScene, currentItem);
            } else {
              addWrong(currentScene, currentItem);
            }
          }
          renderScore(data);
          setStatus('评分完成，可再次按住重试');
          if (dialogMode === 'daily') showDailyNext();
        })
        .catch(function (err) {
          setStatus('评分失败：' + err.message);
        })
        .finally(function () {
          scoring = false;
          if (btn) btn.disabled = false;
        });
    }

    function renderScore(data) {
      var panel = document.getElementById('score-panel');
      var ratingEl = document.getElementById('score-rating');
      panel.hidden = false;

      ratingEl.className = 'score-rating';
      if (data.rating === '优秀') ratingEl.classList.add('excellent');
      else if (data.rating === '不错') ratingEl.classList.add('good');
      else ratingEl.classList.add('retry');

      ratingEl.textContent = '综合评级：' + data.rating + '（' + data.overall + ' 分）';
      document.getElementById('score-pronunciation').textContent = data.pronunciation + ' / 100';
      document.getElementById('score-fluency').textContent = data.fluency + ' / 100';
      document.getElementById('score-completeness').textContent = data.completeness + ' / 100';
      document.getElementById('score-transcript').textContent = '识别结果：' + (data.transcript || '');
      var comment = data.comment ? ('点评：' + data.comment) : '';
      if (data.source === 'local_fallback') {
        comment = (comment ? comment + ' ' : '') + '（当前为本地兜底评分）';
      }
      document.getElementById('score-comment').textContent = comment;
      if (data.warning) {
        console.warn('score warning:', data.warning);
      }
    }

    function showBadgePop(src, title) {

    function checkBadges() {
      var seen = loadJson(BADGE_KEY, {});
      var streak = getStreakDays();
      var mastered = masteredSentenceCount();
      var queue = [];
      if (streak >= 7 && !seen.days7) {
        seen.days7 = true;
        queue.push({ src: 'picture/7days.png', title: '连续学习 7 天' });
      }
      if (mastered >= 20 && !seen.sent20) {
        seen.sent20 = true;
        queue.push({ src: 'picture/20sentences.png', title: '掌握 20 句' });
      }
      if (queue.length) saveJson(BADGE_KEY, seen);
      function next() {
        if (!queue.length) {
          document.getElementById('badge-pop').hidden = true;
          return;
        }
        var b = queue.shift();
        showBadgePop(b.src, b.title);
        document.getElementById('badge-pop').onclick = function () {
          document.getElementById('badge-pop').onclick = null;
          next();
        };
      }
      if (queue.length) next();
    }

    function renderMe() {
      meView = 'home';
      var name = getProfile().name;
      var streak = getStreakDays();
      var mastered = masteredSentenceCount();
      var daysOn = streak >= 7;
      var sentOn = mastered >= 20;
      var root = document.getElementById('me-root');
      root.className = 'me-home';
      root.innerHTML =
        '<div class="me-name-row">' +
          '<h2 id="me-name">' + escapeHtml(name) + '</h2>' +
          '<button type="button" id="me-edit" aria-label="修改昵称">' + PEN_ICON + '</button>' +
        '</div>' +
        '<div class="me-stats">' +
          '<div class="home-box"><p class="k">总时长</p><p class="v">' + formatStudy(getStudyMs()) + '</p></div>' +
          '<div class="home-box"><p class="k">连续天数</p><p class="v">' + streak + ' 天</p></div>' +
          '<div class="home-box"><p class="k">掌握句子</p><p class="v">' + mastered + ' 句</p></div>' +
        '</div>' +
        '<div class="me-badges">' +
          '<div class="me-badge days7"><img src="picture/7days' + (daysOn ? '' : '_grey') + '.png" alt="连续7天"><div class="cap">连续 7 天</div></div>' +
          '<div class="me-badge"><img src="picture/20sentences' + (sentOn ? '' : '_grey') + '.png" alt="掌握20句"><div class="cap">掌握 20 句</div></div>' +
        '</div>' +
        '<div class="me-row" data-me="feedback">意见反馈</div>' +
        '<div class="me-row" data-me="about">关于我们</div>';
      backBtn.hidden = true;
      checkBadges();
    }

    function renderAbout() {
      meView = 'about';
      var root = document.getElementById('me-root');
      root.className = 'about';
      root.innerHTML =
        '<div class="about-wrap">' +
          '<div class="about-head"><h1>能开口就行</h1><p class="sub">AI辅助西湖商户英语口语学习工具</p></div>' +
          '<div class="about-slides">' +
            '<div class="about-block"><h2>一句话介绍</h2><p>“能开口就行”是一款面向惠州西湖景区商户的AI英语口语学习工具，聚焦高频接待场景，帮助商户在短时间内掌握3—5句关键英语，让跨文化交流顺畅发生。</p></div>' +
            '<div class="about-block"><h2>我们为什么做</h2><p>随着240小时过境免签政策落地，越来越多的外国游客来到惠州西湖。2025年广东接待入境游客9030.8万人次，同比增长38.2%。但在美景背后，语言不通成为真实难题。调研显示，66.67%的西湖商户只会简单问候语，能流利使用英语的为零。一句简单问价，可能变成一次失败交流。</p></div>' +
            '<div class="about-block"><h2>我们怎么做</h2><p>我们设计了一款AI辅助的商户英语口语学习工具。不用背单词，不用学语法，只学用得上的一两句。工具聚焦商户高频工作场景：点餐、购物、问路、价格协商。每个场景只需掌握3到5个关键句子。5到10分钟，就能学会一次完整接待对话。</p></div>' +
            '<div class="about-block"><h2>产品特色</h2><ul><li>不背单词，不学语法</li><li>短时高频，即学即用</li><li>真实场景，关键句优先</li><li>AI辅助，开口练习</li><li>网页即开即用</li></ul></div>' +
            '<div class="about-block"><h2>适合谁</h2><p>惠州西湖景区及惠州其他景区商户、店员、文旅从业者，以及希望提升涉外接待能力的一线服务人员。</p></div>' +
            '<div class="about-block"><h2>我们的愿景</h2><p>政策的“大动脉”已经打通，最后“面对面”的那一句话，我们想帮商户说出来。未来，我们计划将工具推广至惠州更多景区，并加入实景视频跟读功能，让学习更有沉浸感。</p><p>能开口就行——让每一位商户，都能自信接待远方的客人。</p></div>' +
            '<div class="about-block"><h2>联系我们</h2><p>项目名称：能开口就行</p><p>联系方式：15812519367</p><p>版本：V1.0</p><p>更新日期：2026年9月</p></div>' +
          '</div>' +
          '<p class="about-foot">数据说明：文中调研数据来自项目调研，仅用于项目介绍。</p>' +
        '</div>';
      backBtn.hidden = false;
    }

    function renderFeedback() {
      meView = 'feedback';
      var root = document.getElementById('me-root');
      root.className = 'fb';
      root.innerHTML =
        '<div class="fb-box">' +
          '<h2>意见反馈</h2>' +
          '<textarea id="fb-text" placeholder="请写下你的建议或问题"></textarea>' +
          '<button type="button" id="fb-send">提交</button>' +
        '</div>';
      backBtn.hidden = false;
    }

    function showTab(name, keepPractice) {
      var ids = { home: 'page-home', scenes: 'page-scenes', practice: 'page-practice', me: 'page-me' };
      for (var k in ids) {
        document.getElementById(ids[k]).classList.toggle('on', k === name);
      }
      var tabs = document.querySelectorAll('#tabbar button');
      for (var t = 0; t < tabs.length; t++) {
        tabs[t].classList.toggle('on', tabs[t].getAttribute('data-page') === name);
      }
      applyHomeBg(name === 'home');
      if (name === 'home') renderHome();
      if (name === 'practice') {
        if (keepPractice && practiceView !== 'list') renderPracticeDetail(practiceView);
        else renderPractice();
      }
      if (name === 'me') renderMe();
    }

    dailyNextBtn.onclick = function () {
      advanceDaily();
    };

    document.getElementById('page-practice').onclick = function (e) {
      var open = e.target.closest('[data-open]');
      if (open && practiceView === 'list') {
        renderPracticeDetail(open.getAttribute('data-open'));
        return;
      }
      var start = e.target.closest('#daily-start');
      if (start) {
        var data = getDaily();
        if (data.idx >= data.queue.length) return;
        var cur = data.queue[data.idx];
        openItem(cur.si, cur.ii, 'daily');
        return;
      }
      var row = e.target.closest('.prac-row');
      if (row) {
        openItem(Number(row.getAttribute('data-si')), Number(row.getAttribute('data-ii')), 'wrong');
        return;
      }
      var speakBtn = e.target.closest('.speak');
      if (speakBtn) {
        var en = speakBtn.previousElementSibling;
        if (en && en.classList.contains('en')) speak(en.textContent, speakBtn);
        return;
      }
      var favBtn = e.target.closest('.fav');
      if (!favBtn) return;
      var enText = favBtn.getAttribute('data-en') || '';
      var zhText = favBtn.getAttribute('data-zh') || '';
      toggleFav(enText, zhText);
      renderPracticeDetail('fav');
    };

    document.getElementById('page-me').onclick = function (e) {
      if (e.target.closest('#me-edit')) {
        var next = window.prompt('请输入昵称', getProfile().name);
        if (next != null && next.trim()) {
          saveJson(PROFILE_KEY, { name: next.trim() });
          renderMe();
        }
        return;
      }
      var row = e.target.closest('[data-me]');
      if (!row) {
        if (e.target.id === 'fb-send') {
          var text = (document.getElementById('fb-text').value || '').trim();
          if (!text) return;
          var list = loadJson('talk_talk_feedback', []);
          list.push({ t: Date.now(), text: text });
          saveJson('talk_talk_feedback', list);
          alert('已提交，感谢反馈');
          renderMe();
        }
        return;
      }
      var act = row.getAttribute('data-me');
      if (act === 'about') renderAbout();
      if (act === 'feedback') renderFeedback();
    };

    setInterval(function () {
      if (document.visibilityState === 'visible') addStudyMs(10000);
    }, 10000);
    window.addEventListener('beforeunload', function () { addStudyMs(5000); });

    document.getElementById('tabbar').onclick = function (e) {
      var b = e.target.closest('button');
      if (!b) return;
      stopRecording(true);
      speechSynthesis.cancel();
      hideDailyNext();
      dialog.hidden = true;
      dialog.classList.remove('daily-mode');
      dialog.classList.remove('daily-done-view');
      dialogMode = 'normal';
      if (view === 'dialog' && currentScene != null) showSubs(currentScene);
      showTab(b.getAttribute('data-page'));
      backBtn.hidden = b.getAttribute('data-page') !== 'scenes' || view !== 'subs';
    };

    document.getElementById('page-home').onclick = function (e) {
      var btn = e.target.closest('.speak');
      if (!btn) return;
      var en = btn.previousElementSibling;
      if (en && en.classList.contains('en')) {
        speak(en.textContent, btn);
      }
    };

    showScenes();
    window.addEventListener('resize', function () {
      if (document.body.classList.contains('home-on')) applyHomeBg(true);
    });
    showTab('home');
  </script>
</body>
</html>
